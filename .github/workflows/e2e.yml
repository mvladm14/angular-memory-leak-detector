# The end-to-end suite, and a check that production builds contain none of
# the detector's code, on every Angular major the detector supports, one job
# per major, all in parallel: the demo app (demo/) for the latest, the compat
# workspaces (compat/ngNN) for the older ones. The detector is built and
# packed once, and every major tests that same tarball, the one npm would
# publish. Runs alongside ci.yml.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: List Angular versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config: no step needs git
          # credentials after checkout.
          persist-credentials: false
      # Each compat/ngNN workspace plus the demo, e.g.
      # [{"angular":16,"dir":"compat/ng16"}, …, {"angular":22,"dir":"demo"}].
      - id: list
        run: echo "apps=$(node scripts/e2e-matrix.mjs)" >> "$GITHUB_OUTPUT"

  build:
    name: Build the detector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config: no step needs git
          # credentials after checkout.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # npm 11 wants the destination to exist.
      - run: mkdir -p tarball && npm pack --pack-destination tarball
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detector-tarball
          path: tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Angular ${{ matrix.angular }} (${{ matrix.dir }})
    needs: [apps, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failure on one Angular major doesn't cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GitHub token in .git/config: no step needs git
          # credentials after checkout.
          persist-credentials: false
      # The Node the app pins: an exact version for a compat workspace, whose
      # toolchain is frozen; the current major for the demo.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The tarball the build job packed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detector-tarball
          path: tarball
      # Installs that tarball into the app, with `npm ci` (CI is set).
      - run: node scripts/install-demo.mjs ${{ matrix.angular }} --tarball tarball/*.tgz
      - id: e2e
        run: node scripts/e2e-compat.mjs ${{ matrix.angular }}
      # A production build must contain none of the detector's code. Runs
      # whether or not the end-to-end tests passed.
      - name: Check the production bundle
        if: success() || steps.e2e.conclusion == 'failure'
        run: node scripts/check-bundle.mjs ${{ matrix.angular }}
      # Playwright keeps a trace of each failed test (playwright.config.ts).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-angular-${{ matrix.angular }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
